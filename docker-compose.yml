version: '3.8'

services:
  codetrace-app:
    build: .
    container_name: codetrace-engine
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=codetrace
      - POSTGRES_PASSWORD=codetrace_pass
      - POSTGRES_DB=codetrace_db
    depends_on:
      - qdrant
      - neo4j
      - postgres
      - redis

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: codetrace-qdrant
    ports:
      - "6333:6333"

  neo4j:
    image: neo4j:5.20.0
    container_name: codetrace-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password

  postgres:
    image: postgres:16-alpine
    container_name: codetrace-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=codetrace
      - POSTGRES_PASSWORD=codetrace_pass
      - POSTGRES_DB=codetrace_db

  redis:
    image: redis:7-alpine
    container_name: codetrace-redis
    ports:
      - "6379:6379"
